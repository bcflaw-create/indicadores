<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Indicadores Financieros</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:#2c3e50}
h1{text-align:center;padding:40px 20px;font-size:2.2rem;font-weight:600}
.carousel-wrapper{overflow:hidden;padding:30px 20px;border-top:1px solid #e1e4e8;border-bottom:1px solid #e1e4e8}
.carousel{display:flex;animation:scroll 40s linear infinite;width:fit-content}
.carousel:hover{animation-play-state:paused}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.card{flex:0 0 280px;background:#f8f9fa;border:1px solid #e1e4e8;padding:25px;margin:0 12px;border-radius:8px;text-align:center}
.label{font-size:0.75rem;color:#7f8c8d;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:700}
.value{font-size:2rem;color:#2c3e50;font-weight:800;margin-bottom:8px}
.unit{color:#95a5a6;font-size:0.9rem;margin-bottom:10px}
.date{color:#bdc3c7;font-size:0.8rem;border-top:1px solid #e1e4e8;padding-top:10px;margin-top:10px}
.footer{text-align:center;padding:20px;color:#95a5a6;font-size:0.85rem;background:#f8f9fa;border-top:1px solid #e1e4e8}
</style>
</head>
<body>
<h1>📊 Indicadores Financieros Banxico</h1>
<div class="carousel-wrapper">
<div class="carousel" id="carousel"></div>
</div>
<div class="footer">Actualizado: <span id="fecha">Cargando...</span></div>
<script>
async function cargar() {
  try {
    const resp = await fetch('/api/indicadores');
    const data = await resp.json();
    let html = '';
    data.indicadores.forEach(i => {
      html += `<div class="card"><div class="label">${i.nombre}</div><div class="value">${parseFloat(i.valor).toFixed(2)}</div><div class="unit">${i.unidad}</div><div class="date">${new Date(i.fecha).toLocaleDateString('es-MX')}</div></div>`;
    });
    document.getElementById('carousel').innerHTML = html + html;
    document.getElementById('fecha').textContent = new Date().toLocaleString('es-MX');
  } catch (e) {
    document.getElementById('carousel').innerHTML = '<div style="color:red;padding:20px">Error al cargar datos</div>';
  }
}
cargar();
setInterval(cargar, 3600000);
</script>
</body>
</html>
