<html><head><meta charset=UTF-8><title>Indicadores</title><style>*{margin:0;padding:0}body{font-family:sans-serif;background:#fff}h1{text-align:center;padding:20px}.carousel{overflow:hidden;width:100%;position:relative}.track{display:flex;animation:scroll 30s linear infinite;width:fit-content}.track:hover{animation-play-state:paused}@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}.card{flex:0 0 250px;background:#f8f9fa;border:1px #e1e4e8 solid;padding:20px;margin:10px;text-align:center}.val{font-size:1.8rem;font-weight:bold;color:#2c3e50}</style></head><body><h1>Indicadores Financieros</h1><div class=carousel><div class=track id=t></div>div></div>div><script>fetch('/api/indicadores').then(r=>r.json()).then(d=>{let h='';d.indicadores.forEach(i=>{h+=`<div class=card><div>${i.nombre}</div><div class=val>${i.valor}</div><div>${i.unidad}</div></div>`});const t=document.getElementById('t');t.innerHTML=h+h})</script></body></html></script></h1></body></style></title></head></html>
